<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>퍼스트 폐차</title>
<!-- 옛 더조은폐차장(워드프레스) 주소 등 없는 페이지로 들어오면 새 홈페이지로 이동 -->
<meta http-equiv="refresh" content="1;url=/" />
<link rel="canonical" href="https://www.upcyclecar.co.kr/" />
<style>
  :root{--navy:#111c2e;--blue:#2563eb;--gray:#6b7280;--bg:#f4f7fc}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:-apple-system,'Malgun Gothic',sans-serif;color:var(--navy);padding:16px;box-sizing:border-box;text-align:center}
  .mark{display:inline-flex;width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:900;font-size:24px;align-items:center;justify-content:center}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:var(--gray);font-size:14px;line-height:1.6;margin:0 0 18px}
  a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:12px 22px;font-weight:700;font-size:15px}
</style>
</head>
<body>
  <div>
    <div class="mark">P</div>
    <h1>홈페이지가 새롭게 바뀌었어요</h1>
    <p>찾으시는 페이지는 새 홈페이지로 옮겨졌습니다.<br>잠시 후 메인 페이지로 이동합니다.</p>
    <a href="/">퍼스트 폐차 바로가기</a>
  </div>
  <script>setTimeout(function(){ location.replace('/'); }, 800);</script>
</body>
</html>
